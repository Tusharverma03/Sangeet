<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/7264503c5b.js" crossorigin="anonymous"></script>
    
</head>
<body>
    <div class="parent">
        <div class="header">
            SANGEET 
        </div>
        <div class="innercontent">
            <div class="options">
                <div class="btns" id="Home" onclick="addHomePage()">
                    <i class="fa-solid fa-house" style="color: #ffffff;"></i> Home
                </div>
                
                <div class="btns" id="Search" onclick="search()">
                    <i class="fa-brands fa-searchengin" style="color: #ffffff;"></i> Search
                </div>
                
                <div class="btns" id="newlyAddedSongs" onclick="addedSongs()">
                    <i class="fa-solid fa-music" style="color: #ffffff;"></i> Added Songs
                </div>
                <div class="btns" id="Library" onclick="showLibrary()">
                    <i class="fa-solid fa-book-open" style="color: #ffffff;"></i>Library
                </div>

                <div class="btns" id="Add-songs" onclick="addSongs()">
                    <i class="fa-solid fa-plus" style="color: #ffffff;"></i>Add Songs
                </div>
                <div class="btns" id="Favorites-btn" onclick="showFavorites()">
                    <i class="fa-solid fa-heart" style="color: #ffffff;"></i> Favorites
                </div>
                <div class="btns" id="Analytics-btn" onclick="showAnalytics()">
                    <i class="fa-solid fa-chart-line" style="color: #ffffff;"></i> Analytics
                </div>
                <div class="btns" id="Exit" onclick="exitApp()">
                    <i class="fa-solid fa-xmark" style="color: #ffffff;"></i> Exit
                </div>
            </div>
             <div class="menu-body">
                <div class="songs-menu"></div>
                            
                 <div class="player player-hidden">
    <!-- 1. Label -->
    <p class="now-playing-label">NOW PLAYING</p>
    
    <!-- 2. Artwork -->
    <img src="assets/images/default.png" class="player-art" id="player-art" alt="Album Art">

    <!-- 3. Song Info & Heart -->
    <div class="player-info">
        <div class="player-text">
            <h2 id="player-title">Song Title</h2>
            <p id="player-artist">Artist Name</p>
        </div>
        <i class="fa-regular fa-heart player-heart" id="like-btn" onclick="toggleFavorite()"></i>
    </div>

    <!-- 4. Progress Bar -->
    <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" class="slider" id="progress-bar" value="0" onchange="manual()">
        <span id="total-time">0:00</span>
    </div>

    <!-- 5. Main Controls -->
    <div class="main-controls">
        <i class="fa-solid fa-backward-step player-icon" onclick="Player.previous()"></i>
        <i class="fa-solid fa-circle-play player-icon-main" id="run" onclick="Player.togglePlay()"></i>
        <i class="fa-solid fa-forward-step player-icon" onclick="Player.next()"></i>
    </div>

    <!-- 6. Secondary Controls -->
    <div class="secondary-controls">
        <i class="fa-solid fa-shuffle player-icon-small" id="shuffle-btn" onclick="this.classList.toggle('active')"></i>
        <i class="fa-solid fa-repeat player-icon-small" id="repeat-btn" onclick="this.classList.toggle('active')"></i>
    </div>

    <!-- 7. Tabs -->
    <!-- 7. Tabs -->
    <div class="player-tabs">
        <span class="tab active" onclick="switchTab('lyrics', this)">Lyrics</span>
        <span class="tab" onclick="switchTab('queue', this)">Queue</span>
        <span class="tab" onclick="switchTab('details', this)">Details</span>
    </div>
    
    <!-- THE MISSING LYRICS BOX (Add these 3 lines!) -->
    <div class="tab-content" id="tab-content-area">
        <p>No lyrics available for this track.</p>
    </div>
    
</div> <!-- This closes the player -->

<script src="jscript/app.js"></script>
<script src="jscript/shortcuts.js"></script>
<script src="jscript/toast.js"></script>

<script src="jscript/recently.js"></script>

</body>
</html>
